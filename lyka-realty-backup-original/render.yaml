services:
  # LYKA Realty AI — Unified Full-Stack Service (FastAPI + React SPA)
  - type: web
    name: lyka-realty-ai
    runtime: python
    plan: free
    rootDir: lyka-realty-backup-original
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: lyka-realty-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://lyka-1.onrender.com","https://lyka-2.onrender.com","https://lyka-orcin.vercel.app","https://lyka-realty-ai.onrender.com","https://lyka-realty-web.onrender.com"]'
      - key: PYTHON_VERSION
        value: 3.12.8

  # Optional Standalone React Frontend
  - type: web
    name: lyka-realty-web
    runtime: static
    plan: free
    rootDir: lyka-realty-backup-original/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://lyka-1.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Managed PostgreSQL Database (Free tier)
databases:
  - name: lyka-realty-db
    plan: free
    databaseName: lyka_realty
    user: lyka_app
